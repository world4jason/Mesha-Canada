<!doctype html>
<html lang="zh-Hant" data-theme="auto">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#132a24" />
  <meta name="description" content="Mesha 與 Kai 的 2026 加拿大行程隨身頁" />
  <title>Mesha Canada 2026</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">CANADA · 2026</p>
        <h1 id="trip-title">加拿大行程</h1>
        <p id="trip-subtitle" class="muted"></p>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="theme-btn" type="button" aria-label="切換主題" title="切換主題">◐</button>
        <button class="icon-btn" id="share-btn" type="button" aria-label="分享目前頁面" title="分享">↗</button>
      </div>
    </header>

    <aside class="day-rail" id="day-rail" aria-label="日期快速切換"></aside>

    <main id="view" class="view" aria-live="polite">
      <section class="panel loading"><span></span><span></span><span></span></section>
    </main>

    <nav class="bottom-nav" aria-label="主要導覽">
      <a href="#now" data-nav="now"><b>⌖</b><span>現在</span></a>
      <a href="#trip" data-nav="trip"><b>▦</b><span>行程</span></a>
      <a href="#map" data-nav="map"><b>⌁</b><span>路線</span></a>
      <a href="#check" data-nav="check"><b>✓</b><span>清單</span></a>
      <a href="#more" data-nav="more"><b>•••</b><span>更多</span></a>
    </nav>
  </div>
  <script src="./app.js" defer></script>
</body>
</html>
